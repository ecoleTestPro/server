# Docker Compose pour EcoleTestPro LMS

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-ecoletestpro}
  DB_USERNAME: root
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: 6379
  CACHE_DRIVER: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis

x-app-volumes: &app-volumes
  - ./:/var/www/html
  - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini

services:
  # Application Laravel (PHP-FPM + Nginx + Queue Worker)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoletestpro_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes: *app-volumes
    networks:
      - ecoletestpro_network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-environment
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: ecoletestpro_mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-ecoletestpro}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ecoletestpro_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis
  redis:
    image: redis:alpine
    container_name: ecoletestpro_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ecoletestpro_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # === Services dev (profil dev) ===

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ecoletestpro_phpmyadmin
    profiles: [dev]
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PMA_PORT:-8099}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecoletestpro_network

  # MailHog
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ecoletestpro_mailhog
    profiles: [dev]
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - ecoletestpro_network

networks:
  ecoletestpro_network:
    name: ecoletestpro_network

volumes:
  mysql_data:
    name: ecoletestpro_mysql_data
  redis_data:
    name: ecoletestpro_redis_data
